<title>Pocket Essentials UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Tenor+Sans&display=swap">
<style>
/* Layout: a tool bar on top, a list of screens on the left, the game screen drawn to scale in the middle, notes under it. */
:root{
  --bg:#f3f2ef; --panel:#ffffff; --fg:#1d1c1a; --muted:#6b675f; --line:#dedad2;
  --accent:#9a7410; --accent-soft:#f3e7c4; --stage:#111113;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --game:"Tenor Sans","Trebuchet MS",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --panel:#1d1c1a; --fg:#ecebe7; --muted:#a09c93; --line:#34322e;
  --accent:#e0b43c; --accent-soft:#3a3018; --stage:#0b0b0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1c1a; --fg:#ecebe7; --muted:#a09c93; --line:#34322e;
  --accent:#e0b43c; --accent-soft:#3a3018; --stage:#0b0b0c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:14px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px}
.seg{display:flex;align-items:center;gap:6px}
.seg>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:4px 10px;cursor:pointer}
.seg button:first-of-type{border-radius:6px 0 0 6px}.seg button:last-of-type{border-radius:0 6px 6px 0}
.seg button+button{margin-left:-7px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600;position:relative}
.seg button:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px)}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 8px 4px;font-weight:600}
nav h2:first-child{margin-top:0}
nav button{font:inherit;text-align:left;background:none;border:0;color:var(--fg);padding:6px 8px;border-radius:6px;cursor:pointer}
nav button:hover{background:var(--line)}
nav button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
main{min-width:0}
.stagebox{background:var(--stage);border-radius:8px;overflow:hidden;position:relative}
.stagebox.actual{overflow:auto}
.scaler{transform-origin:0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600}
.card ul{margin:0;padding-left:18px}.card li{margin:2px 0}
.card .n{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.sub{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap}nav h2{width:100%}}

/* ---- the game screen (always dark: it is the game) ---- */
.screen{position:relative;overflow:hidden;font-family:var(--game);color:#fff;
  background:radial-gradient(120% 90% at 50% 60%,#3b3326 0%,#231e17 55%,#141210 100%)}
.screen *{position:absolute}
.screen .t{white-space:pre-line;overflow-wrap:break-word;line-height:1.15}
.screen .lbl{white-space:nowrap;overflow:hidden;text-align:center;line-height:1}
.gameframe{border:1px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.35)}
.gameframe>.gtag{font-family:var(--ui);color:rgba(255,255,255,.55);white-space:nowrap}
.press{cursor:pointer}
.tex{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
</style>

<header>
  <h1>Pocket Essentials UI <small>how 0.8.1 draws today</small></h1>
  <div class="controls">
    <div class="seg" id="seg-ver"><span>Version</span><button data-v="today">Today (0.8.1)</button><button data-v="proposed">Proposed</button></div>
    <div class="seg" id="seg-res"><span>Screen</span><button data-v="720">720p</button><button data-v="1080">1080p</button></div>
    <div class="seg" id="seg-size"><span>Button size</span><button data-v="small">Small</button><button data-v="medium">Medium</button><button data-v="large">Large</button></div>
    <div class="seg" id="seg-zoom"><span>View</span><button data-v="fit">Fit</button><button data-v="actual">Pixel for pixel</button></div>
  </div>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div class="sub" id="sub"></div>
    <div class="stagebox" id="stagebox"><div class="scaler" id="scaler"></div></div>
    <p class="hint" id="hint"></p>
    <div class="notes" id="notes"></div>
  </main>
</div>

/* ---------- drawing helpers (all positions in 720p units) ---------- */
let K=1, M=null;
const u = n => (n*K)+'px';
const RAW = () => S.res/768; // a raw UI unit, not scaled by Px
function el(tag,parent,css,cls){ const d=document.createElement(tag); if(cls) d.className=cls; if(css) Object.assign(d.style,css); if(parent) parent.appendChild(d); return d; }
function rect(parent,x,y,w,h,color,extra){ return el('div',parent,Object.assign({left:u(x),top:u(y),width:u(w),height:u(h),background:color},extra||{})); }
function fontPx(kind){ if(typeof kind==='number') return kind; return kind==='small'?M.small:kind==='title'?M.font*1.12:M.font; }
function shadow(){ const r=RAW(); return `${r}px ${r}px 0 #000`; }
function text(parent,kind,str,x,y,w,color,align){
  const d=el('div',parent,{left:u(x),top:u(y),width:u(Math.max(w,10)),fontSize:u(fontPx(kind)),color:color||COL[kind],
    textShadow:shadow(),textAlign:align||'left'},'t');
  if(Array.isArray(str)){ for(const [t,c] of str){ const s=document.createElement('span'); s.style.position='static'; if(c) s.style.color=c; s.textContent=t; d.appendChild(s);} }
  else d.textContent=str;
  return d.offsetHeight/K;
}
const canvas=document.createElement('canvas').getContext('2d');
function measure(kind,str){ canvas.font=`${fontPx(kind)*10}px "Tenor Sans"`; return canvas.measureText(str).width/10; }
function button(parent,label,x,y,w,h,style,selected,onClick,opts){
  const st=STYLE[selected?'selected':(style||'normal')]; const b=M.border*(selected?2:1);
  const d=rect(parent,x,y,w,h,st[1]); if(onClick){d.classList.add('press');d.onclick=e=>{e.stopPropagation();onClick();render();};}
  rect(d,b,b,w-2*b,h-2*b,st[0]);
  const l=el('div',d,{left:u(M.gap*.5),width:u(w-M.gap),top:'0',height:u(h),lineHeight:u(h),fontSize:u(M.font),color:st[2],textShadow:shadow()},'lbl');
  l.textContent=label;
  if(opts&&opts.badge){ const bh=M.small*1.25,bw=Math.max(bh,M.small*.62*opts.badge.length+M.small*.5);
    const bd=rect(d,w-bw+M.border,-M.border,bw,bh,C(.85,.08,.08));
    const t=el('div',bd,{left:0,top:0,width:u(bw),height:u(bh),lineHeight:u(bh),fontSize:u(M.small),textShadow:shadow()},'lbl'); t.textContent=opts.badge; }
  return d;
}
function fitWidth(label){ return measure('font',label)+M.pad*2; }
function slotsWidth(n){ return n*M.button*3+(n-1)*M.gap; }
function slotFit(needed,maxW){ const n=Math.max(Math.ceil((needed-0.01+M.gap)/(M.button*3+M.gap)),1); let w=slotsWidth(n); if(maxW) w=Math.min(w,maxW); return w; }
function tint(parent,x,y,w,h,icon,color,extra){ return rect(parent,x,y,w,h,color,Object.assign({WebkitMaskImage:`url(${ICONS[icon]})`,maskImage:`url(${ICONS[icon]})`},extra||{})).classList.add('tex'); }
function gameFrame(parent,x,y,w,h,tag,round){
  const d=rect(parent,x,y,w,h,'',round?{borderRadius:'50%'}:null); d.className='gameframe';
  if(tag){ const t=el('div',d,{left:u(8),top:u(6),fontSize:u(11)},'gtag'); t.textContent=tag; }
  return d;
}

/* ---------- panel and scroll area (UI.lua CreatePanel / CreateScrollArea) ---------- */
function panel(parent,title,w,h,x,y){
  const b=M.border, bar=M.button+M.gap;
  if(x===undefined){ x=(1280-w)/2; y=(720-h)/2; }
  const p=rect(parent,x,y,w,h,GOLDBROWN); rect(p,b,b,w-2*b,h-2*b,PANELFILL);
  rect(p,b,b+bar,w-2*b,b,GOLDBROWN);
  const cw=M.button*2, cx=w-(b+M.gap*.5)-cw, cy=b+M.gap*.5;
  const th=M.font*1.12*1.15; text(p,'title',title,M.pad,b+bar/2-th/2,cx-M.gap-M.pad,null);
  button(p,'Close',cx,cy,cw,M.button,'normal',false,()=>{S.view='hud';});
  const top=b+bar+M.gap;
  return {el:p,x,y,w,h,closeX:cx,closeY:cy,content:{x:M.pad,y:top,w:w-2*M.pad,h:h-top-M.pad}};
}
function scrollArea(parent,x,y,w,h,key,draw,mode){
  // mode: 'always' (settings: bar whenever touch is on), 'twopass' (setup), 'none'
  const barW=M.button*.75;
  const tryDraw = withBar => {
    const viewW = withBar? w-barW-M.gap : w;
    const clip=el('div',parent,{left:u(x),top:u(y),width:u(viewW),height:u(h),overflow:'hidden'});
    const child=el('div',clip,{left:0,top:0,width:u(viewW),height:'1px'});
    const total=draw(new Drawer(child),viewW);
    return {clip,child,total,viewW};
  };
  let withBar = S.touch && mode!=='none';
  let r = tryDraw(mode==='twopass'?false:withBar);
  if(mode==='twopass'){ if(r.total>h+0.5 && S.touch){ r.clip.remove(); r=tryDraw(true);} else withBar=false; }
  const range=Math.max(r.total-h,0); let off=Math.min(Math.max(S.scroll[key]||0,0),range); S.scroll[key]=off;
  r.child.style.top=u(-off);
  const pageBy=Math.max(h-M.row,M.row);
  r.clip.onwheel=e=>{ if(range<=0) return; e.preventDefault(); S.scroll[key]=off+(e.deltaY>0?M.row:-M.row); render(); };
  if(withBar){
    const bx=x+w-barW;
    button(parent,'^',bx,y,barW,M.button,off>0?'step':'stepDim',false,()=>{S.scroll[key]=off-pageBy;});
    button(parent,'v',bx,y+h-M.button,barW,M.button,off<range?'step':'stepDim',false,()=>{S.scroll[key]=off+pageBy;});
    const ty=y+M.button+M.gap, th=h-2*(M.button+M.gap);
    const track=rect(parent,bx,ty,barW,th,GOLDBROWN); const raw=RAW()/K;
    rect(track,raw,raw,barW-2*raw,th-2*raw,C(.03,.03,.04));
    const thumbH=Math.min(th,Math.max(th*Math.min(1,h/Math.max(r.total,1)),M.button*.5));
    const thumbY=range>0?(th-thumbH)*off/range:0;
    rect(track,0,thumbY,barW,thumbH,C(1,.82,0));
  }
  return r;
}

/* ---------- the settings list drawer (Settings.lua Drawer) ---------- */
function Drawer(child){ this.c=child; }
Drawer.prototype.text=function(kind,str,x,y,w,color){ return text(this.c,kind,str,x,y,w,color); };
Drawer.prototype.line=function(y,w){ rect(this.c,0,y,w,M.border,C(.30,.30,.34)); return M.border; };
Drawer.prototype.button=function(label,x,y,w,h,style,fn){ return button(this.c,label,x,y,w,h,style,false,fn); };
Drawer.prototype.mark=function(){ return this.c.childNodes.length; };
Drawer.prototype.rewind=function(m){ while(this.c.childNodes.length>m) this.c.lastChild.remove(); };
Drawer.prototype.numberBox=function(box,x,y){
  const ew=M.button, ww=M.button*2.2, b=M.border;
  button(this.c,'-',x,y,ew,M.button,(box.down&&!box.downDim)?'step':'stepDim',false,box.down||(()=>{}));
  const wx=x+ew-b; const well=rect(this.c,wx,y,ww,M.button,GOLDBROWN); rect(well,b,b,ww-2*b,M.button-2*b,C(.03,.03,.04));
  const inner=ww-2*b, lh=1.15;
  const showUnit=box.unit && M.font+M.small<=M.button-2*b;
  const vh=M.font*lh, uh=M.small*lh, top=showUnit?Math.max((M.button-vh-uh)/2,b):Math.max((M.button-vh)/2,0);
  text(well,'font',box.text,b,top,inner,COL.option,'center');
  if(showUnit) text(well,'small',box.unit,b,top+vh,inner,COL.dim,'center');
  button(this.c,'+',wx+ww-b,y,ew,M.button,(box.up&&!box.upDim)?'step':'stepDim',false,box.up||(()=>{}));
  return M.button*2+M.button*2.2-2*b;
};
Drawer.prototype.flow=function(items,x0,y,maxW,minW){
  let x=x0; const h=M.button;
  for(const it of items){
    let w;
    if(it.box){ w=M.button*2+M.button*2.2-2*M.border; if(x>x0&&x+w>x0+maxW){x=x0;y+=h+M.gap;} this.numberBox(it.box,x,y); }
    else { let need=minW||0; for(const a of (it.alts||[])) need=Math.max(need,fitWidth(a)); need=Math.max(need,fitWidth(it.label));
      w=slotFit(need,maxW); if(x>x0&&x+w>x0+maxW){x=x0;y+=h+M.gap;}
      button(this.c,it.label,x,y,w,h,it.style,it.selected,it.onClick); }
    x+=w+M.gap;
  }
  return y+h;
};
Drawer.prototype.labelColumn=function(texts,inner){ let wid=0; for(const t of texts) wid=Math.max(wid,measure('small',t)); return wid<=0?0:Math.min(wid+M.gap*1.5,inner*.4); };
Drawer.prototype.labeledRow=function(t,items,x,y,inner,lw){
  if(t&&lw>0&&measure('small',t)<=lw-M.gap){
    const m=this.mark(); const bottom=this.flow(items,x+lw,y,inner-lw);
    if(bottom<=y+M.button+0.01){ const th=M.small*1.15; this.text('small',t,x,y+Math.max((M.button-th)/2,0),lw-M.gap,COL.option); return bottom; }
    this.rewind(m);
  }
  if(t) y+=this.text('small',t,x,y,inner,COL.option)+M.gap*.4;
  return this.flow(items,x,y,inner);
};
function optValue(f,o){ return S.opt[f.key][o.key]; }
Drawer.prototype.options=function(f,y,width,onlyAlways){
  const x=M.pad*2, inner=width-x-M.gap;
  const rows=f.options.filter(o=>!onlyAlways||o.always);
  const heads=rows.filter(o=>o.type==='choice'||o.type==='number'||o.type==='stepper').map(o=>o.label);
  const lw=this.labelColumn(heads,inner);
  let tog=[], actionsOnly=true;
  const flush=()=>{ if(!tog.length) return; const minW=(tog.length===1&&actionsOnly)?M.button*4:null; y=this.flow(tog,x,y,inner,minW)+M.gap; tog=[]; actionsOnly=true; };
  for(const o of rows){
    if(o.type!=='toggle'&&o.type!=='action') flush();
    if(o.type==='toggle'){
      const cur=optValue(f,o), [a,b]=o.choices, shown=cur===b[0]?b:a, next=shown===b?a[0]:b[0];
      actionsOnly=false;
      tog.push({label:o.label+': '+shown[1],alts:[o.label+': '+a[1],o.label+': '+b[1]],style:cur===true?'on':'off',onClick:()=>{S.opt[f.key][o.key]=next;}});
    } else if(o.type==='action'){ tog.push({label:o.label,onClick:o.go}); }
    else if(o.type==='choice'){
      const cur=optValue(f,o);
      y=this.labeledRow(o.label,o.choices.map(([v,l])=>({label:l,selected:cur===v,onClick:()=>{S.opt[f.key][o.key]=v;}})),x,y,inner,lw)+M.gap;
    } else if(o.type==='number'){
      const v=optValue(f,o), hasAll=o.all!==undefined;
      let down,up; if(hasAll&&v===o.all){down=o.max;} else { down=v>o.min?v-1:undefined; up=v<o.max?v+1:(hasAll?o.all:undefined); }
      const txt=(hasAll&&v===o.all)?'All':(v===0&&o.offLabel)?o.offLabel:v+(o.suffix||'');
      const set=n=>n===undefined?null:()=>{S.opt[f.key][o.key]=n;};
      y=this.labeledRow(o.label,[{box:{text:txt,unit:o.unit,down:set(down),up:set(up)}}],x,y,inner,lw)+M.gap;
    } else if(o.type==='stepper'){
      const i=CHAT_SIZES.indexOf(S.chatSize);
      const box={text:String(S.chatSize),unit:'text size',down:i>0?()=>{S.chatSize=CHAT_SIZES[i-1];}:null,up:i<CHAT_SIZES.length-1?()=>{S.chatSize=CHAT_SIZES[i+1];}:null};
      y=this.labeledRow(o.label,[{box}],x,y,inner,lw)+M.gap;
    }
  }
  flush(); return y;
};
function featureState(k){ return S.on[k]?'on':'off'; }
function optionsShown(f){ if(!f.options) return [false,false]; const only=!S.on[f.key]; return [only?f.options.some(o=>o.always):f.options.length>0,only]; }
Drawer.prototype.status=function(f,x,y,w){ const s=f.status&&S.on[f.key]?f.status():''; if(s) y+=this.text('small',s,x,y,w,COL.status)+M.gap*.3; return y; };

        return Math.max(yy+pv+M.gap,ry); }); }
    if(e.layout){ y=pCard(d,0,y,width,(ix,iy,iw)=>{ const pw=Math.min(iw*.62,(Math.max(c.h-M.button-M.gap,0)-M.button*3)*16/9);
        const ph=screenPreview(d.c,ix,iy,pw); const rx=ix+pw+M.gap*2, rw=iw-pw-M.gap*2; let ry=iy;
        ry+=text(d.c,'font','Gold boxes show where each piece starts.',rx,ry,rw,C(.92,.92,.92))+M.gap;
        button(d.c,'Move things now',rx,ry,rw,M.button,'normal',false,()=>{S.view='move';}); ry+=M.button+M.gap*.6;
        ry+=text(d.c,'small','You can do this later too: Settings, General tab.',rx,ry,rw,COL.dim);
        return iy+Math.max(ph,ry-iy)+M.gap; }); }
    for(const k of e.feats||[]) y=pFeature(d,FEAT[k],0,y,width,true,e.only&&e.only[k])+M.gap;

        y=pCard(d,0,y,width,(ix,iy,iw)=>{ const lw=(iw-M.gap)/2; let yy=iy; yy+=text(d.c,'small','What the icons mean',ix,yy,iw,COL.option)+M.gap*.6;
          const items=[['slay','Kill'],['loot','Loot'],['object','Use'],['event','Explore'],['turnin','Turn in']]; const side=M.button*.7, colW=iw/5;
          items.forEach(([k,l],i)=>{ const cx=ix+i*colW; if(k==='turnin') turnInIcon(d.c,cx,yy,side); else tint(d.c,cx,yy,side,side,KIND[k][0],KIND[k][1]);
            text(d.c,'font',l,cx+side+M.gap*.5,yy+(side-M.font*1.15)/2,colW-side-M.gap,C(.92,.92,.92)); });
          return yy+side+M.gap; }); } }
    if(e.finish){
      const on=FEATURES.filter(f=>S.on[f.key]).map(f=>PNAME[f.key]), off=FEATURES.filter(f=>!S.on[f.key]).map(f=>PNAME[f.key]);
      y=pCard(d,0,y,width,(ix,iy,iw)=>{ let yy=iy;

        return yy+M.gap*.5; })+M.gap;

}
